<div class="dashboard-wrapper">
  <div class="card main-card">
    <h1>DataBridge AI Dashboard</h1>
    <p class="subtitle">Upload your business data for an instant AI diagnosis.</p>

    <div class="upload-zone" [class.file-ready]="selectedFile">
      <input 
        type="file" 
        #fileInput 
        (change)="onFileSelected($event)" 
        style="display: none" 
      />
      
      <div class="drop-area" (click)="fileInput.click()">
        <div class="icon" *ngIf="!selectedFile">📁</div>
        <div class="icon" *ngIf="selectedFile">✅</div>
        
        <h3 *ngIf="!selectedFile">Click to Select Business File</h3>
        <h3 *ngIf="selectedFile">File Ready: {{ selectedFile.name }}</h3>
        <p *ngIf="!selectedFile">Accepts .txt, .csv, or .pdf</p>
      </div>
    </div>

    <button 
      class="analyze-btn" 
      (click)="upload()" 
      [disabled]="!selectedFile || loading">
      <span *ngIf="!loading">Analyze Document</span>
      <span *ngIf="loading">AI Brain Working...</span>
    </button>

    <div *ngIf="error" class="error-banner">
      ⚠️ {{ error }}
    </div>

    <div *ngIf="uploadResult" class="result-box animate-in">
      <h3>Analysis Result</h3>
      <pre>{{ uploadResult | json }}</pre>
    </div>
  </div>
</div>
